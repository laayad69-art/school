<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>نتائج الطلاب - أم رماد الثانوية المشتركة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-deep: #0b0f1a;
            --bg-card: #111827;
            --bg-card2: #161d2e;
            --border: rgba(196, 162, 93, 0.18);
            --gold: #c4a25d;
            --gold-light: #e0c47a;
            --gold-dim: rgba(196, 162, 93, 0.12);
            --text-primary: #f0eadb;
            --text-secondary: #9ba8b8;
            --text-dim: #5a6477;
            --green: #4ade80;
            --accent-blue: #60a5fa;
            --shadow-gold: 0 0 40px rgba(196, 162, 93, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-deep);
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            right: -20%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(196,162,93,0.04) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(96,165,250,0.04) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        .page-wrap {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 4rem;
        }

        
        .site-header {
            width: 100%;
            max-width: 680px;
            text-align: center;
            margin-bottom: 3rem;
            padding-top: 1rem;
        }

        .school-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--gold-dim);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.35rem 1.2rem;
            font-size: 0.75rem;
            color: var(--gold);
            letter-spacing: 0.5px;
            margin-bottom: 1.4rem;
            font-weight: 600;
        }

        .site-title {
            font-family: 'Amiri', serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 0.6rem;
        }

        .site-title span {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .site-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        
        .ornament {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            justify-content: center;
            margin: 1.4rem 0;
            color: var(--gold);
            opacity: 0.5;
            font-size: 0.9rem;
        }
        .ornament::before,
        .ornament::after {
            content: '';
            flex: 1;
            max-width: 80px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold));
        }
        .ornament::after { background: linear-gradient(to left, transparent, var(--gold)); }

        
        .search-card {
            width: 100%;
            max-width: 680px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: var(--shadow-gold), 0 30px 60px rgba(0,0,0,0.4);
            margin-bottom: 2rem;
        }

        .input-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 0.7rem;
        }

        .input-row {
            display: flex;
            gap: 0.7rem;
            align-items: stretch;
        }

        .id-input {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(196,162,93,0.25);
            border-radius: 0.75rem;
            padding: 0.85rem 1.2rem;
            font-size: 1.05rem;
            font-family: 'Cairo', monospace;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 1.5px;
            transition: all 0.2s;
        }

        .id-input::placeholder { color: var(--text-dim); font-weight: 300; letter-spacing: 0.5px; font-size: 0.9rem; }
        .id-input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(196,162,93,0.06);
            box-shadow: 0 0 0 3px rgba(196,162,93,0.1);
        }

        .search-btn {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border: none;
            border-radius: 0.75rem;
            padding: 0 1.6rem;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a1000;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(196,162,93,0.25);
        }

        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(196,162,93,0.35);
            filter: brightness(1.05);
        }
        .search-btn:active { transform: translateY(0); }

        
        #resultContainer { width: 100%; }

        .placeholder-msg {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .placeholder-msg .big-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            display: block;
            opacity: 0.4;
        }

        
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: var(--shadow-gold), 0 30px 60px rgba(0,0,0,0.4);
            animation: riseIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-school-info {
            margin-bottom: 1rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid rgba(196,162,93,0.15);
        }

        .card-school-name {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold-light);
            margin-bottom: 0.2rem;
        }

        .card-grade-level {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .card-header {
            background: linear-gradient(135deg, #181f30, #1e2840);
            border-bottom: 1px solid var(--border);
            padding: 1.8rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .card-header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .student-name {
            font-family: 'Amiri', serif;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.35;
        }

        .id-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(196,162,93,0.1);
            border: 1px solid rgba(196,162,93,0.2);
            border-radius: 999px;
            padding: 0.25rem 0.9rem;
            font-size: 0.78rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.8px;
            font-family: monospace;
        }

        .card-body { padding: 1.5rem 2rem 2rem; }

        .tables-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.2rem;
        }
        @media (max-width: 560px) {
            .tables-row { grid-template-columns: 1fr; }
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold);
            margin: 1.5rem 0 0.9rem;
            opacity: 0.85;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        
        .grades-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 0.8rem;
            overflow: hidden;
        }

        .grades-table th {
            background: rgba(196,162,93,0.08);
            color: var(--gold);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            padding: 0.7rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .grades-table td {
            padding: 0.7rem 1rem;
            font-size: 0.88rem;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
        }

        .grades-table tr:last-child td { border-bottom: none; }
        .grades-table tbody tr:hover td { background: rgba(255,255,255,0.03); }

        .subject-cell {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
        }

        .subject-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--gold);
            flex-shrink: 0;
            opacity: 0.6;
        }

        .grade-cell {
            text-align: center;
        }

        .grade-pill {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .grade-a  { background: rgba(74,222,128,0.1); color: #4ade80; }
        .grade-b  { background: rgba(96,165,250,0.1); color: #60a5fa; }
        .grade-c  { background: rgba(251,191,36,0.1); color: #fbbf24; }
        .grade-d  { background: rgba(248,113,113,0.1); color: #f87171; }

        
        .optional-wrap { background: rgba(255,255,255,0.015); border-radius: 0.8rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }

        
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .stat-block {
            background: rgba(196,162,93,0.06);
            border: 1px solid rgba(196,162,93,0.15);
            border-radius: 1rem;
            padding: 1.2rem;
            text-align: center;
        }

        .stat-block-label {
            font-size: 0.7rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .stat-block-value {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-block-sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        
        .dl-btn {
            width: 100%;
            max-width: 680px;
            margin-top: 1.2rem;
            background: transparent;
            border: 1px solid rgba(196,162,93,0.3);
            border-radius: 0.9rem;
            padding: 0.8rem;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gold);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .dl-btn:enabled:hover {
            background: rgba(196,162,93,0.08);
            border-color: var(--gold);
        }
        .dl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        
        .error-card {
            background: rgba(248,113,113,0.05);
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            color: #f87171;
            font-size: 0.95rem;
            animation: riseIn 0.3s ease forwards;
        }

        
        .site-footer {
            margin-top: 2.5rem;
            text-align: center;
        }

        .designer-credit {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--gold-dim);
            border: 1px solid rgba(196,162,93,0.3);
            border-radius: 999px;
            padding: 0.45rem 1.3rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 0.3px;
        }

        .designer-credit span {
            opacity: 0.6;
            font-weight: 400;
        }

        @media (max-width: 500px) {
            .search-card, .card-body { padding: 1.2rem; }
            .card-header { padding: 1.2rem; }
            .stats-row { grid-template-columns: 1fr 1fr; gap: 0.7rem; }
            .stat-block-value { font-size: 1.5rem; }
            .grades-table td, .grades-table th { padding: 0.55rem 0.6rem; font-size: 0.8rem; }
            .input-row { flex-direction: column; }
            .search-btn { padding: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="page-wrap">

    <header class="site-header">
        <div class="school-badge">🏫 العام الدراسي 2025 / 2026</div>
        <h1 class="site-title">نتائج <span>الصف الأول</span> الثانوي</h1>
        <p class="site-subtitle">أم رماد الثانوية المشتركة</p>
        <div class="ornament">✦</div>
    </header>

    <div class="search-card">
        <label class="input-label">🔢 أدخل الرقم القومي للطالب</label>
        <div class="input-row">
            <input type="text" id="nationalId" class="id-input"
                   placeholder="١٤ رقمًا" maxlength="14" inputmode="numeric">
            <button class="search-btn" id="searchBtn">عرض النتيجة</button>
        </div>
    </div>

    <div style="width:100%; max-width:680px;">
        <div id="captureArea">
            <div id="resultContainer">
                <div class="placeholder-msg">
                    <span class="big-icon">🎓</span>
                    أدخل الرقم القومي لعرض نتيجة الطالب
                </div>
            </div>
        </div>
        <button id="downloadImageBtn" class="dl-btn" disabled>
            📸 &nbsp; تحميل النتيجة كصورة
        </button>
    </div>

    <footer class="site-footer">
        <div class="designer-credit"><span>تم التصميم بواسطة</span> zmax__1</div>
    </footer>

</div>

<script>
(function() {

    function gradeClass(v) {
        if (v >= 90) return 'grade-a';
        if (v >= 75) return 'grade-b';
        if (v >= 60) return 'grade-c';
        return 'grade-d';
    }

    function maskId(id) {
        if (!id || id.length !== 14) return id;
        return id.slice(0,4) + ' ●●●●●● ' + id.slice(-4);
    }

    function computeTotal(g) {
        let t = 0;
        for (let k in g) t += g[k];
        return { total: t.toFixed(2), pct: ((t/600)*100).toFixed(1) };
    }

    function renderCard(s) {
        const t = computeTotal(s.grades);
        let mainRows = '';
        for (let [sub, val] of Object.entries(s.grades)) {
            mainRows += `
                <tr>
                    <td><div class="subject-cell"><span class="subject-dot"></span>${sub}</div></td>
                    <td class="grade-cell"><span class="grade-pill ${gradeClass(val)}">${val}</span></td>
                </tr>`;
        }
        let optRows = '';
        for (let [sub, val] of Object.entries(s.optional)) {
            optRows += `
                <tr>
                    <td><div class="subject-cell"><span class="subject-dot" style="background:#60a5fa"></span>${sub}</div></td>
                    <td class="grade-cell"><span class="grade-pill ${gradeClass(val)}">${val}</span></td>
                </tr>`;
        }

        return `
        <div class="result-card">
            <div class="card-header">
                <div class="card-school-info">
                    <div class="card-school-name">أم رماد الثانوية المشتركة</div>
                    <div class="card-grade-level">نتيجة الصف الأول الثانوي — 2025/2026</div>
                </div>
                <div class="student-name">${s.name}</div>
                <div class="id-chip">🆔 ${maskId(s.nationalId)}</div>
            </div>
            <div class="card-body">
                <div class="tables-row">
                    <div>
                        <div class="section-label">المواد الأساسية</div>
                        <div style="border-radius:0.8rem; border:1px solid rgba(255,255,255,0.06); overflow:hidden;">
                            <table class="grades-table">
                                <thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
                                <tbody>${mainRows}</tbody>
                            </table>
                        </div>
                    </div>
                    <div>
                        <div class="section-label">مواد الأنشطة</div>
                        <div class="optional-wrap" style="overflow:hidden;">
                            <table class="grades-table">
                                <thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
                                <tbody>${optRows}</tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-block">
                        <div class="stat-block-label">المجموع الكلي</div>
                        <div class="stat-block-value">${t.total}</div>
                        <div class="stat-block-sub">من 600 درجة</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-block-label">النسبة المئوية</div>
                        <div class="stat-block-value">${t.pct}%</div>
                        <div class="stat-block-sub">من إجمالي المواد</div>
                    </div>
                </div>
            </div>
        </div>`;
    }

    const students = [
        { nationalId: "31006231303347", name: "اسراء زكى مصطفى محمد زكي", grades: { "لغة عربية": 84.92, "لغة إنجليزية": 92.67, "رياضيات": 93, "علوم": 88.5 }, optional: { "الحاسب": 92 } },
        { nationalId: "31011031301769", name: "أسراء محسن ناصر احمد السيد", grades: { "لغة عربية": 80.92, "لغة إنجليزية": 82.17, "رياضيات": 94, "علوم": 89 }, optional: { "التاريخ": 85 } },
        { nationalId: "31005101304884", name: "اسماء احمد السيد عبد الرازق السيد", grades: { "لغة عربية": 89, "لغة إنجليزية": 91.75, "رياضيات": 95, "علوم": 92 }, optional: { "الفلسفة": 88 } },
        { nationalId: "30912221302803", name: "اسماء سليمان عطيه عمر مصطفى", grades: { "لغة عربية": 82.5, "لغة إنجليزية": 85.17, "رياضيات": 89.5, "علوم": 86 }, optional: { "الجغرافيا": 84 } },
        { nationalId: "31009291309947", name: "اسينات مختار لطفی رمضان حسن", grades: { "لغة عربية": 81.92, "لغة إنجليزية": 83.25, "رياضيات": 90, "علوم": 87 }, optional: { "الحاسب": 89 } },
        { nationalId: "31001181303144", name: "الاء السيد يونس محمد عطيه", grades: { "لغة عربية": 76, "لغة إنجليزية": 79.92, "رياضيات": 87.75, "علوم": 83 }, optional: { "التربية الفنية": 82 } },
        { nationalId: "31010011340249", name: "أميره عبد الناصر عبد الحميد محمد عبد الله", grades: { "لغة عربية": 78.67, "لغة إنجليزية": 78.5, "رياضيات": 85, "علوم": 80 }, optional: { "الموسيقى": 81 } },
        { nationalId: "31005291301568", name: "أيه السيد عطيه عباس سليم", grades: { "لغة عربية": 77.25, "لغة إنجليزية": 80.08, "رياضيات": 90.5, "علوم": 84 }, optional: { "الحاسب": 86 } },
        { nationalId: "31005131303025", name: "بسمله أيمن محمد عبد المنعم عطيه", grades: { "لغة عربية": 87.75, "لغة إنجليزية": 94, "رياضيات": 96, "علوم": 91 }, optional: { "الفلسفة": 90 } },
        { nationalId: "31006011309921", name: "بسمله هاني عبد المنصف امين الشناوى", grades: { "لغة عربية": 68.5, "لغة إنجليزية": 73.08, "رياضيات": 75, "علوم": 70 }, optional: { "التاريخ": 72 } },
        { nationalId: "31007151306244", name: "جنا عزت محمد الهادي محمد عناني", grades: { "لغة عربية": 78.17, "لغة إنجليزية": 81.33, "رياضيات": 88, "علوم": 83 }, optional: { "الجغرافيا": 85 } },

    function search() {
        const raw = input.value.trim();
        if (!/^\d{14}$/.test(raw)) {
            alert('الرجاء إدخال الرقم القومي الصحيح المكون من 14 رقمًا.');
            return;
        }
        const s = students.find(x => x.nationalId === raw);
        if (s) {
            rc.innerHTML = renderCard(s);
            found = true;
            dlBtn.disabled = false;
        } else {
            rc.innerHTML = `<div class="error-card">⚠️ لم يتم العثور على بيانات لهذا الرقم القومي<br><small style="opacity:.6;font-size:.8rem">تأكد من إدخال الرقم بشكل صحيح</small></div>`;
            found = false;
            dlBtn.disabled = true;
        }
    }

    async function downloadImg() {
        if (!found) return;
        const el = document.getElementById('captureArea');
        const orig = dlBtn.innerHTML;
        dlBtn.innerHTML = '⏳ جاري الإنشاء...';
        dlBtn.disabled = true;
        try {

            await document.fonts.ready;
            const canvas = await html2canvas(el, {
                scale: 3,
                backgroundColor: '#0b0f1a',
                logging: false,
                useCORS: true,
                allowTaint: false,
                foreignObjectRendering: false,
                onclone: async (clonedDoc) => {

                    await clonedDoc.fonts.ready;

                    const allEls = clonedDoc.querySelectorAll('*');
                    allEls.forEach(el => {
                        const style = window.getComputedStyle(el);
                        if (style.fontFamily) {
                            el.style.fontFamily = "'Cairo', 'Amiri', sans-serif";
                        }

                        el.style.letterSpacing = '0px';
                        el.style.wordSpacing = '0px';
                    });
                }
            });
            const a = document.createElement('a');
            const nameEl = el.querySelector('.student-name');
            a.download = `نتيجة_${nameEl ? nameEl.innerText.trim() : 'الطالب'}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
        } catch(e) {
            console.error(e);
            alert('حدث خطأ أثناء التحميل.');
        }
        dlBtn.innerHTML = orig;
        dlBtn.disabled = false;
    }

    btn.addEventListener('click', e => { e.preventDefault(); search(); });
    input.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); search(); } });
    input.addEventListener('input', function() { this.value = this.value.replace(/\D/g,'').slice(0,14); });
    dlBtn.addEventListener('click', downloadImg);

})();
</script>
</body>
</html>
